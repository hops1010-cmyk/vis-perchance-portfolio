<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1115">
  <title>VISTAMATIONS · Perchance Embed</title>
  <style>
    :root{color-scheme:dark;font:14px/1.5 "Segoe UI",Arial,sans-serif;background:#0b1115;color:#edf2ec;--lime:#c9ff63;--gold:#f4b84a}*{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    .page{height:100%;display:flex;flex-direction:column;overflow:hidden;background:#0b1115}
    .bar{min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.55rem 1rem;background:linear-gradient(110deg,#162127,#11191e 68%,#1e2820);border-bottom:1px solid #40504b}
    .brand{color:var(--lime);font-size:.68rem;font-weight:800;letter-spacing:.16em}
    .name{margin-left:.7rem;color:#edf2ec;font-size:.95rem;letter-spacing:0;overflow-wrap:anywhere}
    .back{color:var(--gold);text-decoration:none;white-space:nowrap}.back:hover{text-decoration:underline}
    iframe{display:block;flex:1;width:100%;min-height:0;border:0;background:#10171b}
    @media(max-width:520px){.bar{min-height:44px;padding:.45rem .65rem;font-size:.78rem}.name{display:block;margin:.1rem 0 0}}
  </style>
</head>
<body>
  <div class="page">
    <header class="bar">
      <div><span class="brand">VISTAMATIONS</span><span class="name" id="slug-name">Loading…</span></div>
      <a class="back" href="/">← Portfolio</a>
    </header>
    <iframe id="tool-frame" title="Perchance generator" referrerpolicy="no-referrer" allow="clipboard-read; clipboard-write; fullscreen" allowfullscreen></iframe>
  </div>
  <script>
    'use strict';
    (function () {
      var parts = window.location.pathname.split('/').filter(Boolean);
      // path is like: [embed, <slug>]
      var slug = parts[1] || '';
      if (slug) {
        document.getElementById('slug-name').textContent = slug;
        document.getElementById('tool-frame').src = 'https://null.perchance.org/' + encodeURIComponent(slug);
      }
    })();
  </script>
</body>
</html>
